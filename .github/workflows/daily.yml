name: daily
# Once a day at 11:17 UTC (06:17 ET in winter), after ClinicalTrials.gov's daily refresh.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNBC_CONTACT: ${{ secrets.DNBC_CONTACT }}
    steps:
      # Skip quietly until the DATABASE_URL secret is set (see docs/PLAN.md section 10).
      - name: secrets set?
        id: gate
        run: if [ -n "$DATABASE_URL" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "DATABASE_URL secret not set; skipping"; fi
      - if: steps.gate.outputs.ok == '1'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ok == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ok == '1'
        run: npm ci
      - if: steps.gate.outputs.ok == '1'
        run: npm run job -- daily
      - if: steps.gate.outputs.ok == '1'
        run: npm run job -- stories
